<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cat 存档</title>
<style>
  :root {
    --bg:#f7f8fa; --panel:#fff; --fg:#1f2328; --dim:#6b7280; --faint:#9ca3af;
    --line:#e2e5ea; --accent:#2f6fed; --accent-fg:#fff; --warn:#b45309;
    --ok:#1a7f37; --bad:#c0392b; --hover:#f0f3f8; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#161a20; --fg:#e6edf3; --dim:#8b949e; --faint:#6e7681;
            --line:#2a3038; --accent:#58a6ff; --accent-fg:#0f1115; --warn:#d29922;
            --ok:#3fb950; --bad:#f85149; --hover:#1e242c; --shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }

  header {
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px;
    padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sep { color:var(--line); }
  header .links a { color:var(--dim); text-decoration:none; font-size:13px; padding:4px 8px;
                    border-radius:6px; }
  header .links a:hover { background:var(--hover); color:var(--fg); }
  header .links a.current { color:var(--accent); font-weight:600; }
  header .grow { flex:1; }

  main { max-width:980px; margin:0 auto; padding:20px 20px 60px; }

  button { font:inherit; cursor:pointer; border:1px solid var(--line); border-radius:7px;
           padding:6px 16px; background:var(--panel); color:var(--fg); }
  button:hover { background:var(--hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  button.primary:hover { filter:brightness(1.06); }
  button:disabled { opacity:.45; cursor:default; }
  button.link { border:none; background:none; color:var(--dim); padding:4px 8px; font-size:12px; }
  button.link:hover { color:var(--fg); background:var(--hover); }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button.danger:hover { background:rgba(192,57,43,.08); }
  button.mini { padding:2px 9px; font-size:12px; border-radius:5px; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden; }
  .card > .head { display:flex; align-items:center; gap:10px; padding:13px 18px;
                  border-bottom:1px solid var(--line); }
  .card > .head .title { font-size:14.5px; font-weight:600; }
  .card > .head .grow { flex:1; }
  .card > .body { padding:14px 18px; }
  .card.disabled > .head .title { color:var(--dim); }

  .row { display:flex; align-items:baseline; gap:10px; padding:4px 0; font-size:13px; }
  .row > .k { flex:0 0 96px; color:var(--dim); font-size:12px; }
  .row > .v { flex:1; min-width:0; word-break:break-all; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }

  .tag { font-size:11px; border-radius:5px; padding:1px 6px; border:1px solid var(--line);
         color:var(--dim); white-space:nowrap; }
  .tag.on { color:var(--ok); border-color:var(--ok); }
  .tag.off { color:var(--faint); }

  .empty { color:var(--dim); font-size:13px; padding:32px; text-align:center; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px;
           font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }
  .toast.bad { background:var(--bad); color:#fff; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
           align-items:center; justify-content:center; z-index:30; padding:18px; }
  .modal.show { display:flex; }
  .dialog { background:var(--panel); border-radius:12px; width:100%; max-width:720px;
            max-height:90vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .dialog > .head { display:flex; align-items:center; padding:14px 18px;
                    border-bottom:1px solid var(--line); position:sticky; top:0;
                    background:var(--panel); z-index:1; }
  .dialog > .head h2 { margin:0; font-size:15px; }
  .dialog > .head .grow { flex:1; }
  .dialog > .body { padding:16px 18px; }
  .dialog > .foot { display:flex; gap:10px; padding:12px 18px;
                    border-top:1px solid var(--line); position:sticky; bottom:0;
                    background:var(--panel); }
  .dialog > .foot .grow { flex:1; }

  .field { margin-bottom:14px; }
  .field > label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .field input[type=text], .field input[type=password], .field select {
    font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line);
    border-radius:7px; padding:6px 10px; width:100%;
  }
  .field input:focus, .field select:focus { outline:2px solid var(--accent); outline-offset:-1px;
    border-color:transparent; }
  .field .tip { font-size:11.5px; color:var(--faint); margin-top:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ── Link 列表 ── */
  .link-row { border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px;
              background:var(--bg); }
  .link-row .lr-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .link-row .lr-head .idx { font-size:12px; color:var(--dim); }
  .link-row .lr-head .grow { flex:1; }
  .link-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .link-grid .full { grid-column:1 / -1; }
  .link-row .f label { display:block; font-size:11.5px; color:var(--dim); margin-bottom:3px; }
  .link-row .f input, .link-row .f select {
    font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:5px 9px; width:100%; font-size:12.5px; }
  .link-row .f input:focus, .link-row .f select:focus { outline:2px solid var(--accent);
    outline-offset:-1px; border-color:transparent; }

  /* ── 聊天列表 ── */
  .chat-line { display:flex; align-items:center; gap:8px; padding:5px 8px;
               border:1px solid var(--line); border-radius:6px; margin-bottom:6px;
               font-size:12.5px; background:var(--bg); }
  .chat-line .grow { flex:1; }
  .chat-add { display:grid; grid-template-columns:110px 110px 1fr auto; gap:8px; margin-top:8px; }
  .chat-add input, .chat-add select {
    font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:5px 9px; font-size:12.5px; width:100%; }
  .hintline { font-size:11.5px; color:var(--faint); margin-top:6px; }
</style>
</head>
<body>

<header>
  <h1>cat 存档</h1>
  <span class="sep">|</span>
  <span class="links">
    <a href="/settings">设置</a>
    <a href="/archives" class="current">存档</a>
    <a href="/logs">日志</a>
  </span>
  <span class="grow"></span>
  <span style="font-size:12px;color:var(--dim)" id="count"></span>
  <button class="primary" id="create">新建存档</button>
  <button class="link" id="reload">刷新</button>
</header>

<main>
  <div id="list"></div>
</main>

<div class="modal" id="modal">
  <div class="dialog">
    <div class="head">
      <h2 id="modalTitle">新建存档</h2>
      <span class="grow"></span>
      <button class="link" id="modalClose">关闭</button>
    </div>
    <div class="body">

      <div class="field">
        <label>存档名</label>
        <input type="text" id="f-name" placeholder="例如：黑猫">
        <div class="tip">一个存档 = 一个模拟人。名字要唯一。</div>
      </div>

      <div class="field">
        <label>绑定的 DSH 会话</label>
        <select id="f-sessionId">
          <option value="">（不绑定 / 手动填写）</option>
        </select>
        <input type="text" id="f-sessionIdManual" placeholder="列表里没有？手动填 session-xxx" style="margin-top:6px">
        <div class="tip">候选来自跳板心跳上报。列表为空说明跳板还没连上 Java。</div>
      </div>

      <div class="field">
        <label>会话名</label>
        <input type="text" id="f-sessionTitle" placeholder="选会话后自动带出，也可手改">
      </div>

      <div class="field">
        <label>外部连接（Link）</label>
        <div id="links"></div>
        <button type="button" class="mini" id="addLink">+ 添加一条连接</button>
        <div class="tip">一个存档可以有多条连接（比如同时挂两个 QQ 号）。
          账号在同一渠道内不能重复。</div>
      </div>

      <div class="field">
        <label>认识的聊天（ChatKey）</label>
        <div id="chats"></div>
        <div class="chat-add">
          <select id="chat-kind"></select>
          <select id="chat-type">
            <option value="group">群聊</option>
            <option value="private">私聊</option>
          </select>
          <input type="text" id="chat-id" placeholder="群号 / QQ 号（纯数字）">
          <button type="button" class="mini" id="addChat">添加</button>
        </div>
        <div class="hintline">只有这里列出的群 / 私聊，这个存档才会去拉消息。</div>
      </div>

      <div class="field">
        <label><input type="checkbox" id="f-enabled"> 启用这个存档</label>
      </div>

    </div>
    <div class="foot">
      <button class="primary" id="save">保存</button>
      <button id="cancel">取消</button>
      <span class="grow"></span>
      <button class="danger" id="remove" style="display:none">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)

/** 候选：{ sessions: {id: title}, channels: ["external_qq", ...] } */
let candidates = { sessions: {}, channels: [] }
let archives = []
let editingId = null

/** 编辑中的 Link 列表，每项是页面自己的状态（不是后端对象） */
let links = []
/** 编辑中的 ChatKey 列表，每项 { channel, type, id } */
let chats = []

function toast(msg, bad) {
  const el = $('toast')
  el.textContent = msg
  el.className = 'toast show' + (bad ? ' bad' : '')
  setTimeout(() => { el.className = 'toast' }, 2000)
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
}

/** "external_qq:group:20001" → { channel, type, id }；解析不了返回 null */
function parseChatWire(wire) {
  const m = /^([a-z_]+):(group|private):(\d+)$/.exec(String(wire || '').trim())
  return m ? { channel: m[1], type: m[2], id: m[3] } : null
}

function chatWire(c) {
  return `${c.channel}:${c.type}:${c.id}`
}

// ── 读取 ──────────────────────────────────────────────

async function loadCandidates() {
  try {
    const res = await fetch('/api/archives/candidates', { cache: 'no-store' })
    const body = await res.json()
    if (body.success && body.data) {
      candidates = {
        sessions: body.data.sessions || {},
        channels: body.data.channels || [],
      }
    }
  } catch {
    // 候选拿不到不影响存档列表，表单里还能手填
  }
  if (!candidates.channels.length) candidates.channels = ['external_qq']
}

async function load() {
  try {
    const res = await fetch('/api/archives', { cache: 'no-store' })
    const body = await res.json()
    if (!body.success) throw new Error(body.message || '读取失败')
    archives = body.data || []
    render()
  } catch (e) {
    $('list').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`
  }
}

// ── 列表 ──────────────────────────────────────────────

function render() {
  $('count').textContent = archives.length ? `共 ${archives.length} 个` : ''
  const box = $('list')
  box.textContent = ''

  if (!archives.length) {
    const el = document.createElement('div')
    el.className = 'empty'
    el.textContent = '还没有存档。点右上角「新建存档」开始。'
    box.appendChild(el)
    return
  }
  for (const a of archives) box.appendChild(renderCard(a))
}

function renderCard(a) {
  const card = document.createElement('div')
  card.className = 'card' + (a.enabled ? '' : ' disabled')

  const head = document.createElement('div')
  head.className = 'head'

  const title = document.createElement('span')
  title.className = 'title'
  title.textContent = a.name || '(未命名)'

  const tag = document.createElement('span')
  tag.className = 'tag ' + (a.enabled ? 'on' : 'off')
  tag.textContent = a.enabled ? '启用中' : '已停用'

  const grow = document.createElement('span')
  grow.className = 'grow'

  const edit = document.createElement('button')
  edit.className = 'link'
  edit.textContent = '编辑'
  edit.addEventListener('click', () => openEditor(a))

  head.append(title, tag, grow, edit)

  const body = document.createElement('div')
  body.className = 'body'

  body.appendChild(row('存档 ID', a.id, true))
  body.appendChild(row('DSH 会话',
    a.session && a.session.sessionId
      ? `${a.session.sessionId}${a.session.title ? '（' + a.session.title + '）' : ''}`
      : '未绑定', true))

  const linkList = a.links || []
  if (linkList.length) {
    body.appendChild(row('连接', linkList.map(l =>
      `${l.kind || '?'}${l.account ? ' · ' + l.account : ''}${l.baseUrl ? ' @ ' + l.baseUrl : ''}`
    ).join('　|　'), false))
  } else {
    body.appendChild(row('连接', '未配置', false))
  }

  const chatList = a.chats || []
  body.appendChild(row('认识', chatList.length ? chatList.join('　') : '未配置', false))

  card.append(head, body)
  return card
}

function row(k, v, mono) {
  const r = document.createElement('div')
  r.className = 'row'
  const kEl = document.createElement('span')
  kEl.className = 'k'
  kEl.textContent = k
  const vEl = document.createElement('span')
  vEl.className = 'v' + (mono ? ' mono' : '')
  vEl.textContent = v
  r.append(kEl, vEl)
  return r
}

// ── 编辑：会话下拉 ────────────────────────────────────

function fillSessionOptions() {
  const sel = $('f-sessionId')
  const keep = sel.value
  sel.textContent = ''
  const none = document.createElement('option')
  none.value = ''
  none.textContent = '（不绑定 / 手动填写）'
  sel.appendChild(none)
  for (const id of Object.keys(candidates.sessions)) {
    const o = document.createElement('option')
    o.value = id
    const title = candidates.sessions[id]
    o.textContent = title ? `${title}（${id}）` : id
    sel.appendChild(o)
  }
  sel.value = keep
}

function fillChannelOptions() {
  for (const sel of [$('chat-kind')]) {
    sel.textContent = ''
    for (const k of candidates.channels) {
      const o = document.createElement('option')
      o.value = k
      o.textContent = k
      sel.appendChild(o)
    }
  }
}

// ── 编辑：Link 多行 ───────────────────────────────────

function blankLink() {
  return {
    kind: candidates.channels[0] || 'external_qq',
    enabled: true,
    account: '',
    baseUrl: '',
    token: '',
    deviceId: '',
    // 已保存过的 token 不会被后端回显；页面要知道「这个密码框是空的但服务端有值」
    hasStoredToken: false,
  }
}

function renderLinks() {
  const box = $('links')
  box.textContent = ''

  if (!links.length) {
    const empty = document.createElement('div')
    empty.className = 'hintline'
    empty.textContent = '还没有连接。至少加一条，否则这个存档收不到也发不出消息。'
    box.appendChild(empty)
    return
  }

  links.forEach((link, i) => {
    const wrap = document.createElement('div')
    wrap.className = 'link-row'

    const head = document.createElement('div')
    head.className = 'lr-head'
    const idx = document.createElement('span')
    idx.className = 'idx'
    idx.textContent = `连接 ${i + 1}`
    const grow = document.createElement('span')
    grow.className = 'grow'
    const del = document.createElement('button')
    del.type = 'button'
    del.className = 'mini danger'
    del.textContent = '删除'
    del.addEventListener('click', () => {
      links.splice(i, 1)
      renderLinks()
    })
    head.append(idx, grow, del)

    const grid = document.createElement('div')
    grid.className = 'link-grid'

    grid.appendChild(linkField('渠道', (() => {
      const sel = document.createElement('select')
      for (const k of candidates.channels) {
        const o = document.createElement('option')
        o.value = k
        o.textContent = k
        sel.appendChild(o)
      }
      // 存档里可能有已下线的渠道，保留它免得一保存就被改掉
      if (link.kind && !candidates.channels.includes(link.kind)) {
        const o = document.createElement('option')
        o.value = link.kind
        o.textContent = link.kind + '（不可用）'
        sel.appendChild(o)
      }
      sel.value = link.kind || ''
      sel.addEventListener('change', () => { link.kind = sel.value })
      return sel
    })()))

    grid.appendChild(linkField('账号（QQ 号等）', (() => {
      const input = document.createElement('input')
      input.type = 'text'
      input.value = link.account || ''
      input.placeholder = '10000'
      input.addEventListener('input', () => { link.account = input.value.trim() })
      return input
    })()))

    const baseWrap = linkField('OneBot 地址', (() => {
      const input = document.createElement('input')
      input.type = 'text'
      input.value = link.baseUrl || ''
      input.placeholder = 'http://127.0.0.1:3000'
      input.addEventListener('input', () => { link.baseUrl = input.value.trim() })
      return input
    })())
    baseWrap.classList.add('full')
    grid.appendChild(baseWrap)

    const tokenWrap = linkField('Token', (() => {
      const input = document.createElement('input')
      input.type = 'password'
      input.value = ''
      input.placeholder = link.hasStoredToken ? '已保存（留空 = 不改）' : '没有就留空'
      input.addEventListener('input', () => { link.token = input.value.trim() })
      return input
    })())
    tokenWrap.classList.add('full')
    grid.appendChild(tokenWrap)

    grid.appendChild(linkField('设备 ID（ESP32 等才用）', (() => {
      const input = document.createElement('input')
      input.type = 'text'
      input.value = link.deviceId || ''
      input.placeholder = '可留空'
      input.addEventListener('input', () => { link.deviceId = input.value.trim() })
      return input
    })()))

    const enabledWrap = document.createElement('div')
    enabledWrap.className = 'f'
    const cb = document.createElement('input')
    cb.type = 'checkbox'
    cb.checked = link.enabled !== false
    cb.addEventListener('change', () => { link.enabled = cb.checked })
    enabledWrap.append(cb, document.createTextNode(' 启用这条连接'))
    grid.appendChild(enabledWrap)

    wrap.append(head, grid)
    box.appendChild(wrap)
  })
}

function linkField(labelText, control) {
  const f = document.createElement('div')
  f.className = 'f'
  const label = document.createElement('label')
  label.textContent = labelText
  f.append(label, control)
  return f
}

// ── 编辑：ChatKey 增删 ────────────────────────────────

function renderChats() {
  const box = $('chats')
  box.textContent = ''

  if (!chats.length) {
    const empty = document.createElement('div')
    empty.className = 'hintline'
    empty.textContent = '还没有认识的聊天。在下面选渠道、类型，填号码后点「添加」。'
    box.appendChild(empty)
    return
  }

  chats.forEach((c, i) => {
    const line = document.createElement('div')
    line.className = 'chat-line'

    const label = document.createElement('span')
    label.className = 'mono'
    label.textContent = chatWire(c)

    const grow = document.createElement('span')
    grow.className = 'grow'

    const del = document.createElement('button')
    del.type = 'button'
    del.className = 'mini danger'
    del.textContent = '移除'
    del.addEventListener('click', () => {
      chats.splice(i, 1)
      renderChats()
    })

    line.append(label, grow, del)
    box.appendChild(line)
  })
}

// ── 打开编辑器 ────────────────────────────────────────

function openEditor(a) {
  editingId = a ? a.id : null
  $('modalTitle').textContent = a ? '编辑存档' : '新建存档'

  fillSessionOptions()
  fillChannelOptions()

  const session = a && a.session ? a.session : null
  $('f-name').value = a ? (a.name || '') : ''
  $('f-sessionTitle').value = session ? (session.title || '') : ''
  $('f-enabled').checked = a ? Boolean(a.enabled) : true

  // 会话：候选里有就选中下拉，没有就落到手填框
  const sid = session ? (session.sessionId || '') : ''
  const inList = sid && Object.prototype.hasOwnProperty.call(candidates.sessions, sid)
  $('f-sessionId').value = inList ? sid : ''
  $('f-sessionIdManual').value = inList ? '' : sid

  // Link：完整还原（后端不回 token，只记「存过没有」）
  links = (a && a.links ? a.links : []).map(l => ({
    kind: l.kind || (candidates.channels[0] || 'external_qq'),
    enabled: l.enabled !== false,
    account: l.account || '',
    baseUrl: l.baseUrl || '',
    token: '',
    deviceId: l.deviceId || '',
    hasStoredToken: Boolean(l.hasStoredToken),
  }))
  if (!links.length) links = [blankLink()]
  renderLinks()

  // ChatKey：后端给的是 wire 字符串
  chats = (a && a.chats ? a.chats : [])
    .map(parseChatWire)
    .filter(Boolean)
  renderChats()

  $('chat-id').value = ''
  $('remove').style.display = a ? '' : 'none'
  $('modal').classList.add('show')
}

function closeEditor() {
  $('modal').classList.remove('show')
  editingId = null
  links = []
  chats = []
}

// ── 保存 / 删除 ───────────────────────────────────────

function collectLinks() {
  const out = []
  for (const l of links) {
    const account = (l.account || '').trim()
    const baseUrl = (l.baseUrl || '').trim()
    // 整行都没填的就跳过（用户加了一条又不想填）
    if (!account && !baseUrl && !l.token) continue
    const item = {
      kind: l.kind,
      enabled: l.enabled !== false,
      account: account || null,
      baseUrl: baseUrl || null,
      deviceId: (l.deviceId || '').trim() || null,
    }
    // 只有真的输入了才覆盖 token；留空表示沿用服务端那份
    if (l.token) item.token = l.token
    out.push(item)
  }
  return out
}

async function save() {
  const name = $('f-name').value.trim()
  if (!name) { toast('存档名不能为空', true); return }

  const sessionId = ($('f-sessionId').value || $('f-sessionIdManual').value).trim()

  const body = {
    name,
    enabled: $('f-enabled').checked,
    session: {
      sessionId: sessionId || null,
      status: 'BOUND',
      title: $('f-sessionTitle').value.trim() || null,
    },
    links: collectLinks(),
    chats: chats.map(chatWire),
  }
  if (editingId) body.id = editingId

  $('save').disabled = true
  try {
    const res = await fetch('/api/archives', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    })
    const data = await res.json()
    if (!data.success) { toast(data.message || '保存失败', true); return }
    closeEditor()
    await load()
    await loadCandidates()
    toast('已保存')
  } catch (e) {
    toast('保存失败：' + e.message, true)
  } finally {
    $('save').disabled = false
  }
}

async function remove() {
  if (!editingId) return
  if (!confirm('删除这个存档？它的目录会被移进回收站。')) return
  try {
    const res = await fetch('/api/archives/' + encodeURIComponent(editingId), { method: 'DELETE' })
    const data = await res.json()
    if (!data.success) { toast(data.message || '删除失败', true); return }
    closeEditor()
    await load()
    toast('已删除')
  } catch (e) {
    toast('删除失败：' + e.message, true)
  }
}

// ── 事件绑定 ──────────────────────────────────────────

$('create').addEventListener('click', () => openEditor(null))
$('reload').addEventListener('click', async () => { await load(); await loadCandidates() })
$('modalClose').addEventListener('click', closeEditor)
$('cancel').addEventListener('click', closeEditor)
$('save').addEventListener('click', save)
$('remove').addEventListener('click', remove)
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeEditor() })

$('addLink').addEventListener('click', () => {
  links.push(blankLink())
  renderLinks()
})

$('addChat').addEventListener('click', () => {
  const channel = $('chat-kind').value
  const type = $('chat-type').value
  const id = $('chat-id').value.trim()
  if (!id) { toast('填一下群号或 QQ 号', true); return }
  if (!/^\d+$/.test(id)) { toast('号码只能是数字', true); return }
  const wire = chatWire({ channel, type, id })
  if (chats.some(c => chatWire(c) === wire)) { toast('这个聊天已经加过了', true); return }
  chats.push({ channel, type, id })
  renderChats()
  $('chat-id').value = ''
})

$('chat-id').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('addChat').click() }
})

// 选了下拉里的会话，把会话名带出来（名字是叫板报的，不该靠手写）
$('f-sessionId').addEventListener('change', () => {
  const id = $('f-sessionId').value
  if (!id) return
  const title = candidates.sessions[id]
  if (title) $('f-sessionTitle').value = title
  $('f-sessionIdManual').value = ''
})

load().then(loadCandidates).then(() => { if (!archives.length) render() })
</script>
</body>
</html>
